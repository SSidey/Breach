[package]
name = "breach_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# api-4-7: bindings generated from Godot 4.7's extension API, bundled with the crate.
godot = { version = "=0.5.5", features = ["api-4-7"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
